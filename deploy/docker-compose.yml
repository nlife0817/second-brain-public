name: secondbrain

# Всё приложение на одном сервере: база, Next.js, TLS-терминатор и расписания.
# Переменные читаются из deploy/.env (см. env.example).

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Та же локаль, что у Supabase: дамп несёт коллации колонок, и при другой
      # локали кластера восстановление ругается, а сортировка молча меняется.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    # Порт наружу не публикуем: база доступна только внутри compose-сети.
    # С ноутбука — через `ssh -L 5433:localhost:5432 user@server` + `docker compose port`.

  app:
    # Имя задано явно, хотя compose и сам собрал бы его из имени проекта и
    # сервиса: deploy.sh вешает на прежнюю сборку тег secondbrain-app:rollback,
    # и полагаться на угаданное имя там нельзя.
    image: secondbrain-app:latest
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* вшиваются в бандл при сборке — менять их можно только
        # пересборкой образа, правки в .env на них не влияют.
        NEXT_PUBLIC_APP_URL: ${APP_URL}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Дублирует build-аргумент намеренно: в бандл значение вшивается при
      # сборке, но серверный код (redirect_uri для Google в lib/auth/oauth-state.ts)
      # читает ту же переменную в рантайме. Без неё origin взялся бы из заголовка
      # Host, где за Caddy стоит внутреннее имя контейнера, и Google отверг бы
      # redirect_uri как несовпадающий.
      NEXT_PUBLIC_APP_URL: ${APP_URL}
    depends_on:
      db:
        condition: service_healthy
    # Проверка нужна не столько для перезапусков, сколько для выката: deploy.sh
    # запускает `up -d --wait` и по ней понимает, поднялась новая версия или пора
    # возвращать прежний образ.
    #
    # node вместо curl: в образе на node:22-bookworm-slim curl нет, и тянуть его
    # ради одной проверки не стоит. Дёргаем /login — серверный рендер реальной
    # страницы, то есть ловим и невзлетевший сервер, и падение на рендере.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    # after() дописывает пуши уже после ответа клиенту — даём процессу успеть
    # доработать их перед SIGKILL.
    stop_grace_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  cron:
    build:
      context: ./cron
    restart: unless-stopped
    environment:
      # Ходит к приложению внутри сети, минуя Caddy и TLS: сертификат для
      # внутреннего имени всё равно не выпишешь.
      INTERNAL_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET}
      # Расписания заданы в UTC — как в исходных миграциях pg_cron.
      TZ: UTC
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
  caddy-config:
